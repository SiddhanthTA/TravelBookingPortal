spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/app_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Preserve existing development data while the schema evolves.
# Use Flyway/Liquibase migrations before treating this as a production deployment.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Customer profile image uploads (stored outside the database)
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT: override with a private random secret of at least 32 characters outside development.
app.jwt.secret=${JWT_SECRET:travel-portal-dev-secret-change-this-32chars-minimum}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
# Comma-separated frontend origins; configure the deployed frontend origin in production.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}
